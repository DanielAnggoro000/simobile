<ion-app>
  <ion-menu auto-hide="true" contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ion-list>
        <ion-menu-toggle>

          <ion-item>
            <ion-label>Dark Mode</ion-label>
            <ion-toggle (ionChange)="toggleDarkMode($event)"></ion-toggle>
          </ion-item>


          <ion-item routerLink="/dashboard">
            <ion-icon name="home" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item routerLink="/produk">
            <ion-icon name="list" slot="start"></ion-icon>
            <ion-label>Belanja</ion-label>
          </ion-item>

          <ion-item routerLink="/transaksi">
            <ion-icon name="receipt-outline" slot="start"></ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>

          <!-- <ion-item routerLink="/keranjang">
            <ion-icon name="cart" slot="start"></ion-icon>
            <ion-label>Keranjang</ion-label>
          </ion-item> -->

          <ion-item routerLink="/tambah-produk">
            <ion-icon name="add" slot="start"></ion-icon>
            <ion-label>Tambah Produk</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>



  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-tabs>
    <ion-tab-bar slot="bottom">

      <ion-tab-button tab="home">
        <ion-icon name="home"></ion-icon>
        <ion-label>Pengaturan</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="about">
        <ion-icon name="help-circle-outline"></ion-icon>
        <ion-label>About</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="logout">
        <ion-icon name="log-out-outline"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
  </ion-tabs>

</ion-app>
