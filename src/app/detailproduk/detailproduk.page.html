<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/produk"></ion-back-button>
    </ion-buttons>
    <ion-title>{{product.name}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{product.name}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item>
      <ion-img [src]="product.img_url "></ion-img>
    </ion-item>
    <ion-item>
      Kategori: {{product.category}}
    </ion-item>
    <ion-item>
      Harga Jual: {{product.sell_price}} 
    </ion-item>
    <ion-item>
      Harga Beli: {{product.buy_price}}
    </ion-item>
    <ion-item>
      Untung per item: {{product.sell_price - products.buy_price}}
    </ion-item>
    <ion-item>
      Stock: {{product.stock}}
    </ion-item>
    <ion-item>
      Jumlah di keranjang: {{jumlahDiKeranjang()}}
    </ion-item>

    <ion-item>
      <ion-button [disabled]="product.stock == 0" (click)="tambahKeranjang()" color="">
        Tambah ke Keranjang
      </ion-button>
      <ion-button routerLink="/editproduk/{{ index }}">
        Edit Produk
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
