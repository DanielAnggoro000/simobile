<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Keranjang: {{getCount()}} items</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">keranjang</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item *ngFor="let item of getIsi()">
      <ion-label>
        <h2>{{products[item.indexProduk].name}}</h2>
        <p>Rp {{products[item.indexProduk].sellPrice}} x {{item.jumlah}}
          = Rp {{products[item.indexProduk].sellPrice * item.jumlah}}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-label>Total: Rp {{getTotal()}}</ion-label>
  </ion-item>

  <ion-item>
    <ion-button [disabled]="getIsi().length == 0" (click)="konfirmasi()">
      Konfirmasi Transaksi
    </ion-button>
    <ion-button color="danger" [disabled]="getIsi().length == 0" (click)="kosongkan()">
      Kosongkan
    </ion-button>
  </ion-item>
</ion-content>
