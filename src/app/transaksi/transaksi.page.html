<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">transaksi</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    <ion-item>
      <ion-button size="small" (click)="refresh()">
        Refresh
      </ion-button>
    </ion-item>
    <ion-item *ngFor="let t of history; let i = index" routerLink="/detailtransaksi/{{i}}">
      <ion-label>
        <h2>{{t.id}}</h2>
        <p>{{formatTanggal(t.tanggal)}}</p>
        <p>Total: Rp {{t.totalPrice}}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
